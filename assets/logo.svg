<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>agy-monitor</title>
  <defs>
    <linearGradient id="agyBg" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="agyAccent" x1="28" y1="30" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#34D399"/>
      <stop offset="85%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <!-- ~10% transparent margin preserved outside [14, 114] -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#agyBg)" stroke="#38BDF8" stroke-width="3.5"/>
  <!-- Top 256K context segmented bar -->
  <rect x="28" y="30" width="72" height="12" rx="6" fill="#334155"/>
  <rect x="28" y="30" width="58" height="12" rx="6" fill="url(#agyAccent)"/>
  <line x1="91" y1="27" x2="91" y2="45" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Telemetry activity bars -->
  <rect x="30" y="74" width="11" height="22" rx="3" fill="#38BDF8"/>
  <rect x="47" y="62" width="11" height="34" rx="3" fill="#34D399"/>
  <rect x="64" y="54" width="11" height="42" rx="3" fill="#38BDF8"/>
  <rect x="81" y="48" width="11" height="48" rx="3" fill="#FBBF24"/>
  <!-- High-contrast pulse trend line -->
  <path d="M32 66 L52 54 L70 60 L94 44" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="94" cy="44" r="4.5" fill="#FB7185" stroke="#F8FAFC" stroke-width="2"/>
</svg>
